name: Assemble FIX13 firmware snapshot

on:
  push:
    paths:
      - 'firmware_snapshots/.transfer/fix13.b64.part04'
      - 'firmware_snapshots/.transfer/trigger-fix13'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify FIX13
        shell: bash
        run: |
          set -euo pipefail
          d=firmware_snapshots/.transfer
          cat "$d"/fix13.b64.part{01,02,03,04} | base64 -d > firmware_snapshots/GreenMover_ACTIVE_HANDOFF_TEST1_FIX13_FINE_GAIN_1650_1700.zip
          echo "a482c12123919b7a86366abf15becf7a48c377d1694feb65115e921dc7576043  firmware_snapshots/GreenMover_ACTIVE_HANDOFF_TEST1_FIX13_FINE_GAIN_1650_1700.zip" | sha256sum -c -
          rm -rf "$d"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware_snapshots
          git commit -m "Publish FIX13 firmware snapshot"
          git push
